name: Build and check

# Builds the site and runs the quality gate (internal links, HTML validity,
# Lighthouse budgets). Runs on its own for branches and pull requests, and is
# called by deploy.yml so the same checks stand between master and production.
on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build

      - name: Check internal links and assets
        run: npm run check:links
      - name: Validate HTML
        run: npm run check:html
      - name: Lighthouse budgets
        run: npm run check:lighthouse
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
